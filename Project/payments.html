<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment Options</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Select Payment Method</h1>

  <form id="payment-form">
    <label>
      <input type="radio" name="payment" value="Bank Transfer" required>
      Bank Transfer (Acct: 1234567890, First Bank Nigeria)
    </label><br>

    <label>
      <input type="radio" name="payment" value="Card Payment">
      Online Card Payment
    </label><br>

    <label>
      <input type="radio" name="payment" value="Bitcoin">
      Bitcoin (Wallet: bc1qexamplewalletaddress)
    </label><br>

    <button type="submit">Continue</button>
  </form>

  <script>
    document.getElementById("payment-form").addEventListener("submit", function(e){
      e.preventDefault();
      const method = document.querySelector('input[name="payment"]:checked').value;
      localStorage.setItem("paymentMethod", method);
      window.location.href = "confirmation.html";
    });
  </script>
</body>
</html>
