<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Confirmation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Membership Confirmation</h1>
  <div id="confirmation-details"></div>

  <script>
    const packageName = localStorage.getItem("selectedPackage");
    const name = localStorage.getItem("memberName");
    const email = localStorage.getItem("memberEmail");
    const phone = localStorage.getItem("memberPhone");
    const payment = localStorage.getItem("paymentMethod");

    document.getElementById("confirmation-details").innerHTML = `
      <p>Thank you, <strong>${name}</strong>!</p>
      <p>Your membership for <strong>${packageName}</strong> has been successfully registered.</p>
      <p>Email: ${email}</p>
      <p>Phone: ${phone}</p>
      <p>Payment Method: ${payment}</p>
      <p>A confirmation email has been sent to you.</p>
    `;
  </script>
</body>
</html>
